
<div class="app-shell" [class.dark-theme]="isDark()">

  <!-- Botón de tema para pantallas de acceso -->
  @if (currentView() !== 'dashboard') {
    <button
      type="button"
      class="theme-toggle login-theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark() ? 'Activar tema claro' : 'Activar tema oscuro'"
      [title]="isDark() ? 'Activar tema claro' : 'Activar tema oscuro'"
    >
      {{ isDark() ? '☀' : '☾' }}
    </button>
  }

  <!-- Inicio de sesión -->
  @if (currentView() === 'login') {
    <app-login
      (requestAccess)="showAccessRequest()"
      (previewDashboard)="openDashboardPreview()"
      (forgotPassword)="showRecoverPassword()">
    </app-login>
  }

  <!-- Solicitud de acceso -->
  @if (currentView() === 'request') {
    <app-access-request
      (backToLogin)="showLogin()">
    </app-access-request>
  }

  <!-- Recuperación de contraseña -->
  @if (currentView() === 'recover') {
    <app-recover-password
      (backToLogin)="showLogin()"
      (previewNewPassword)="showNewPasswordPreview()">
    </app-recover-password>
  }

  <!-- Nueva contraseña: vista previa -->
  @if (currentView() === 'new-password') {
    <app-new-password
      (backToLogin)="showLogin()">
    </app-new-password>
  }

  <!-- Panel administrativo -->
  @if (currentView() === 'dashboard') {
    <app-dashboard
      [isDark]="isDark()"
      (toggleThemeEvent)="toggleTheme()"
      (closeDashboard)="closeDashboardPreview()">
    </app-dashboard>
  }

</div>
