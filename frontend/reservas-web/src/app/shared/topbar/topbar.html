
<header class="topbar">

  <div class="topbar-left">
    <div class="topbar-breadcrumb">
      <span class="breadcrumb-home">UES FMO</span>
      <span class="breadcrumb-separator">/</span>
      <strong>{{ activeModule }}</strong>
    </div>

    <div class="topbar-title">
      <h2>{{ activeModule }}</h2>
      <span>Gestión institucional de espacios académicos</span>
    </div>
  </div>

  <div class="topbar-right">

    <span class="demo-badge">
      <span class="demo-status-dot"></span>
      DEMOSTRACIÓN
    </span>

    <button
      type="button"
      class="theme-toggle"
      (click)="changeTheme()"
      [attr.aria-label]="isDark ? 'Activar tema claro' : 'Activar tema oscuro'"
      [title]="isDark ? 'Activar tema claro' : 'Activar tema oscuro'"
    >
      {{ isDark ? '☀' : '☾' }}
    </button>

    <div class="topbar-user">
      <div class="topbar-avatar">U</div>

      <div class="topbar-user-info">
        <strong>Usuario de prueba</strong>
        <span>Vista administrativa</span>
      </div>
    </div>

  </div>

</header>
