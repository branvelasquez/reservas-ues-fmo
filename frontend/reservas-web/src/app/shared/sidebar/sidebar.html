
<aside class="sidebar">

  <!-- IDENTIDAD INSTITUCIONAL -->
  <div class="sidebar-brand">
    <div class="sidebar-logo">UES</div>

    <div class="sidebar-brand-text">
      <strong>UES FMO</strong>
      <span>Sistema de Reservas</span>
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <!-- MENÚ PRINCIPAL -->
  <div class="sidebar-section-label">
    MENÚ PRINCIPAL
  </div>

  <nav class="sidebar-nav">
    @for (item of items; track item.name) {
      <button
        type="button"
        class="sidebar-link"
        [class.active]="activeModule === item.name"
        (click)="selectModule(item.name)"
      >
        <span class="sidebar-link-icon">
          {{ item.icon }}
        </span>

        <span class="sidebar-link-text">
          {{ item.name }}
        </span>

        @if (activeModule === item.name) {
          <span class="sidebar-active-indicator"></span>
        }
      </button>
    }
  </nav>

  <!-- INFORMACIÓN DEL USUARIO Y SALIDA -->
  <div class="sidebar-bottom">

    <div class="sidebar-divider"></div>

    <div class="sidebar-user">

      <div class="sidebar-user-avatar">
        {{ userRoleName.charAt(0) }}
      </div>

      <div class="sidebar-user-info">
        <strong>{{ userRoleName }}</strong>
        <span>Perfil de demostración</span>
      </div>

    </div>

    <button
      type="button"
      class="sidebar-exit"
      (click)="exitDashboard()"
    >
      <span class="sidebar-exit-icon">↪</span>
      <span>Salir del panel</span>
    </button>

  </div>

</aside>
